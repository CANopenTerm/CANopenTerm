name: Continuous Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: Release

jobs:
  Linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update -y -qq
        sudo apt-get install ninja-build libsocketcan-dev libreadline-dev

    - name: Build unit tests
      run: |
        cmake -B ${{github.workspace}}/build -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_TESTS=ON ${{github.workspace}}
        cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Run unit tests
      run: |
        cp -r ${{github.workspace}}/export/tests ${{github.workspace}}/build/tests
        ctest --test-dir ${{github.workspace}}/build -C ${{env.BUILD_TYPE}} --verbose

  Windows:
    needs:   Linux
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Build
        run: |
          cmake -G "Ninja" -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
          cmake --build build

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet packages
        run: nuget restore setup/setup.sln

      - name: Build WiX Toolset solution
        run: |
          cd setup
          msbuild /p:Configuration=Release /p:Platform=x64

      - name: Prepare artifacts for zip
        run: |
          $artifactDir = "artifacts"
          New-Item -ItemType Directory -Path $artifactDir -Force

          # Find and copy all executables (.exe) from build directory recursively
          Get-ChildItem -Path "build" -Recurse -Include "*.exe" | ForEach-Object {
            Write-Host "Copying $($_.FullName) to $artifactDir"
            Copy-Item -Path $_.FullName -Destination $artifactDir -Force
          }

          # Find and copy all DLLs from build directory recursively
          Get-ChildItem -Path "build" -Recurse -Include "*.dll" | ForEach-Object {
            Write-Host "Copying $($_.FullName) to $artifactDir"
            Copy-Item -Path $_.FullName -Destination $artifactDir -Force
          }

          # Copy data directories
          if (Test-Path "export") {
            if (Test-Path "export\codb") { Copy-Item -Path "export\codb" -Destination "$artifactDir" -Recurse -Force }
            if (Test-Path "export\dbc") { Copy-Item -Path "export\dbc" -Destination "$artifactDir" -Recurse -Force }
            if (Test-Path "export\eds") { Copy-Item -Path "export\eds" -Destination "$artifactDir" -Recurse -Force }
            if (Test-Path "export\scripts") { Copy-Item -Path "export\scripts" -Destination "$artifactDir" -Recurse -Force }
          }

          # List what we copied
          Write-Host "Contents of artifacts directory:"
          Get-ChildItem -Path $artifactDir -Recurse

      - name: Create zip archive
        run: |
          $artifactDir = "artifacts"
          $zipFile = "CANopenTerm.zip"
          Compress-Archive -Path "$artifactDir\*" -DestinationPath $zipFile -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: |
            setup/CANopenTerm/bin/x64/Release/en-US/CANopenTerm.msi
            CANopenTerm.zip

  Publish:
    if: github.event_name != 'pull_request'
    needs: Windows
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: build-artifacts
        path: .

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          CANopenTerm.msi
          CANopenTerm.zip
        tag_name: latest
        name: "Latest Build"
        body: "This is the latest build of CANopenTerm."
        draft: false
        prerelease: true
        token: ${{ secrets.GITHUB_TOKEN }}
        make_latest: true
