name: Continuous Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: Release

jobs:
  Linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update -y -qq
        sudo apt-get install ninja-build libsocketcan-dev libreadline-dev

    - name: Build unit tests
      run: |
        cmake -B ${{github.workspace}}/build -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_TESTS=ON ${{github.workspace}}
        cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Run unit tests
      run: |
        cp -r ${{github.workspace}}/export/tests ${{github.workspace}}/build/tests
        ctest --test-dir ${{github.workspace}}/build -C ${{env.BUILD_TYPE}} --verbose

  Windows:
    needs:   Linux
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Build
        env:
          CC: cl.exe
          CXX: cl.exe
        run: |
          cmake -G "Ninja" -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
          cmake --build build

      - name: Debug - Check build results
        run: |
          Write-Host "=== After CMake build ==="
          Write-Host "`nDirectory structure:"
          Get-ChildItem -Path "." -Directory | Select-Object Name

          if (Test-Path "export") {
            Write-Host "`nexport directory contents:"
            Get-ChildItem -Path "export" -Recurse | Format-Table FullName
          } else {
            Write-Host "`nexport directory does NOT exist"
          }

          if (Test-Path "build") {
            Write-Host "`nbuild directory - looking for binaries:"
            Get-ChildItem -Path "build" -Recurse -Include "*.exe", "*.dll" | Format-Table FullName
          }

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet packages
        run: nuget restore setup/setup.sln

      - name: Build WiX Toolset solution
        run: |
          cd setup
          msbuild /p:Configuration=Release /p:Platform=x64

      - name: Prepare artifacts for zip
        run: |
          Write-Host "=== ARTIFACT PREPARATION ==="
          $artifactDir = "artifacts"
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          $filesFound = 0

          # Check all possible locations for executables and DLLs
          Write-Host "`nSearching for executables..."
          foreach ($searchPath in @(".", "export", "build")) {
            if (Test-Path $searchPath) {
              $exeFiles = Get-ChildItem -Path $searchPath -Recurse -Include "*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "CANopenTerm|codb2json" }
              if ($exeFiles) {
                foreach ($file in $exeFiles) {
                  Write-Host "Found: $($file.FullName)"
                  Copy-Item -Path $file.FullName -Destination $artifactDir -Force
                  $filesFound++
                }
              }
            }
          }

          Write-Host "`nSearching for DLLs..."
          foreach ($searchPath in @(".", "export", "build")) {
            if (Test-Path $searchPath) {
              $dllFiles = Get-ChildItem -Path $searchPath -Recurse -Include "*.dll" -ErrorAction SilentlyContinue
              if ($dllFiles) {
                foreach ($file in $dllFiles) {
                  Write-Host "Found: $($file.FullName)"
                  Copy-Item -Path $file.FullName -Destination $artifactDir -Force
                  $filesFound++
                }
              }
            }
          }

          Write-Host "`nSearching for data directories..."
          foreach ($dir in @("codb", "dbc", "eds", "scripts")) {
            if (Test-Path "export\$dir") {
              Write-Host "Found: export\$dir"
              Copy-Item -Path "export\$dir" -Destination "$artifactDir" -Recurse -Force
              $filesFound++
            } elseif (Test-Path "$dir") {
              Write-Host "Found: $dir"
              Copy-Item -Path $dir -Destination "$artifactDir" -Recurse -Force
              $filesFound++
            }
          }

          Write-Host "`n=== RESULTS ==="
          Write-Host "Files/dirs copied: $filesFound"
          Write-Host "`nArtifacts directory contents:"
          $artifacts = Get-ChildItem -Path $artifactDir -Recurse
          if ($artifacts) {
            $artifacts | Format-Table FullName
          } else {
            Write-Host "WARNING: Artifacts directory is EMPTY!"
          }

      - name: Create zip archive
        run: |
          $artifactDir = "artifacts"
          $zipFile = "CANopenTerm.zip"
          Compress-Archive -Path "$artifactDir\*" -DestinationPath $zipFile -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: |
            setup/CANopenTerm/bin/x64/Release/en-US/CANopenTerm.msi
            CANopenTerm.zip

  Publish:
    if: github.event_name != 'pull_request'
    needs: Windows
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: build-artifacts
        path: .

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          CANopenTerm.msi
          CANopenTerm.zip
        tag_name: latest
        name: "Latest Build"
        body: "This is the latest build of CANopenTerm."
        draft: false
        prerelease: true
        token: ${{ secrets.GITHUB_TOKEN }}
        make_latest: true
